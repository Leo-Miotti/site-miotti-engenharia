{% extends "base.html" %}

{% block conteudo %}
<section style="padding: 4rem 2rem; max-width: 800px; margin: 0 auto;">
    <div style="border: 1px solid var(--cor-borda, #ccc); padding: 2.5rem; background: var(--cor-fundo-card, #fff);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 1rem; margin-bottom: 2rem;">
            <h2 style="font-family: monospace; text-transform: uppercase; margin: 0;">// Painel do Cliente</h2>
            <a href="{{ url_for('logout') }}" style="font-family: monospace; font-size: 0.85rem; color: #d00; text-decoration: none; border: 1px solid #d00; padding: 0.4rem 0.8rem;">SAIR</a>
        </div>

        <p style="font-family: monospace; font-size: 1.1rem; margin-bottom: 1.5rem;">
            Seja bem-vindo(a), <strong>{{ nome }}</strong>!
        </p>

        <div style="background: #f9f9f9; border-left: 3px solid #000; padding: 1.5rem; font-family: monospace;">
            <h4 style="margin-top: 0; text-transform: uppercase;">Status dos Projetos</h4>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 0;">
                Nenhum projeto vinculado à sua conta no momento. Em breve, você poderá acompanhar o andamento das suas obras e plantas por aqui.
            </p>
        </div>
    </div>
</section>
{% endblock %}
